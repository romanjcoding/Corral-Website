<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Corral</title>
  <link rel="icon" type="image/png" href="/img/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="puzzle-header">
    <nav class="puzzle-nav">
      <a id="nav-prev" href="#">previous</a>
      <a href="index.html">all puzzles</a>
      <a id="nav-next" href="#">next</a>
    </nav>
    <h1 id="puzzle-name"></h1>
    <div class="puzzle-meta"><span id="puzzle-difficulty"></span></div>
  </header>

  <div class="board-wrapper">
    <div class="board-bar">
      <div id="area-counter" title="Squares you've enclosed" aria-live="polite">0</div>
      <div class="board-tools">
        <button type="button" id="redo-button"   title="Clear the board" aria-label="Clear the board">↺</button>
        <button type="button" id="help-button"   title="How to play"     aria-label="How to play">?</button>
        <button type="button" id="submit-button" title="Send in your solution" aria-label="Send in your solution">⇧</button>
      </div>
    </div>

    <div id="grid"></div>

    <div id="help-popover" hidden>
      <div class="share-title">How to play</div>
      <p class="how-lede">Your goal is to enclose as many squares as you can.</p>
      <div class="how-figs"></div>
      <div class="how-keys"></div>
      <div class="how-actions">
        <button type="button" id="help-solution" hidden>Show a solution</button>
        <button type="button" id="help-close">Close</button>
      </div>
    </div>

    <div id="share-popover" hidden>
      <div class="share-title">Share this arrangement</div>
      <div class="share-row">
        <input id="share-link" type="text" readonly spellcheck="false">
        <button type="button" id="share-copy">Copy</button>
      </div>
      <div id="share-status"></div>
    </div>

    <div id="solve-popover" hidden>
      <div class="share-title">Send in your solution</div>
      <p class="solve-note" id="solve-summary"></p>

      <form id="solve-form">
        <div class="share-row">
          <input id="solve-name" name="name" type="text" placeholder="Your name"
                 maxlength="40" autocomplete="name" spellcheck="false" data-fs-field required>
          <button type="submit" id="solve-send" data-fs-submit-btn>Send</button>
        </div>
        <span class="fs-error" data-fs-error="name"></span>

        <!-- the board itself, so the arrangement travels with the name -->
        <input type="hidden" name="puzzle"   id="solve-puzzle">
        <input type="hidden" name="score"    id="solve-score">
        <input type="hidden" name="best"     id="solve-best">
        <input type="hidden" name="code"     id="solve-code">
        <input type="hidden" name="link"     id="solve-link">
        <input type="hidden" name="_subject" id="solve-subject">

        <!-- honeypot: real people never fill this in -->
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" class="fs-gotcha" aria-hidden="true">
      </form>

      <div id="solve-status" data-fs-success></div>
      <div class="fs-error" data-fs-error></div>
    </div>
  </div>

  <div id="tray"></div>
</main>

<div id="piece-controls" hidden>
  <button type="button" id="ctl-cancel">Cancel</button>
  <button type="button" id="ctl-cw"   class="glyph" title="Rotate" aria-label="Rotate">↻</button>
  <button type="button" id="ctl-flip" class="glyph" title="Flip"   aria-label="Flip">⇄</button>
  <button type="button" id="ctl-place">Place</button>
</div>

<script src="puzzles.js"></script>
<script src="game.js"></script>
<script src="https://unpkg.com/@formspree/ajax@1" defer></script>
</body>
</html>
